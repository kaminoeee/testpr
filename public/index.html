<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eeeproxy</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      background: #1e1e1e;
      padding: 10px;
      display: flex;
      gap: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 10;
    }
    #url-form {
      flex: 1;
      display: flex;
      gap: 10px;
    }
    #url-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 16px;
    }
    button {
      padding: 8px 16px;
      background: #de5833; /* DuckDuckGo Orange */
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #c44725;
    }
    #browser-frame {
      flex: 1;
      border: none;
      background: #fff;
      width: 100%;
      height: calc(100% - 55px);
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="back-btn">←</button>
    <button id="forward-btn">→</button>
    <button id="home-btn">🏠 DDG</button>
    <form id="url-form">
      <input type="text" id="url-input" placeholder="URLを入力 または DuckDuckGoで検索..." />
      <button type="submit" id="go-btn">検索 / 移動</button>
    </form>
  </div>
  <iframe id="browser-frame" src=""></iframe>

  <script>
    const urlInput = document.getElementById('url-input');
    const urlForm = document.getElementById('url-form');
    const browserFrame = document.getElementById('browser-frame');
    const homeBtn = document.getElementById('home-btn');
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');

    function loadUrl(inputVal) {
      if (!inputVal) return;
      
      let targetUrl = inputVal.trim();
      
      // URL形式かどうかを判定（ドメインらしい文字列やhttp/httpsで始まっているか）
      const isUrl = /^(https?:\/\/)?[\w.-]+\.[a-z]{2,}([\/?#].*)?$/i.test(targetUrl) || targetUrl.startsWith('http://') || targetUrl.startsWith('https://');

      if (!isUrl) {
        // URLではなくキーワードの場合はDuckDuckGoで検索
        targetUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(targetUrl);
      } else if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        targetUrl = 'https://' + targetUrl;
      }

      const proxyUrl = '/api/proxy?url=' + encodeURIComponent(targetUrl);
      browserFrame.src = proxyUrl;
      urlInput.value = targetUrl;
    }

    urlForm.addEventListener('submit', (e) => {
      e.preventDefault();
      loadUrl(urlInput.value);
    });

    homeBtn.addEventListener('click', () => {
      loadUrl('https://duckduckgo.com/');
    });

    backBtn.addEventListener('click', () => {
      try { browserFrame.contentWindow.history.back(); } catch(e) {}
    });

    forwardBtn.addEventListener('click', () => {
      try { browserFrame.contentWindow.history.forward(); } catch(e) {}
    });

    // 初期起動時はDuckDuckGoを表示
    loadUrl('https://duckduckgo.com/');
  </script>
</body>
</html>
