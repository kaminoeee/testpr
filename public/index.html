<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Browser</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      background: #1e293b;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }
    #url-form {
      flex: 1;
      display: flex;
      gap: 10px;
    }
    #url-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    #url-input:focus {
      border-color: #3b82f6;
    }
    button {
      padding: 10px 20px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    #browser-frame {
      flex: 1;
      border: none;
      background: #fff;
      width: 100%;
      height: calc(100% - 60px);
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <form id="url-form">
      <input type="text" id="url-input" placeholder="URLまたは検索キーワードを入力..." />
      <button type="submit" id="go-btn">アクセス / 検索</button>
    </form>
  </div>
  <iframe id="browser-frame" src=""></iframe>

  <script>
    const urlInput = document.getElementById('url-input');
    const urlForm = document.getElementById('url-form');
    const browserFrame = document.getElementById('browser-frame');

    urlForm.addEventListener('submit', (e) => {
      e.preventDefault();
      let inputVal = urlInput.value.trim();
      if (!inputVal) return;

      let targetUrl = inputVal;

      // URL形式かどうかを判定（http/httpsで始まる、またはドメインの形をしているか）
      const isUrl = /^(https?:\/\/)?[\w.-]+\.[a-z]{2,}([\/?#].*)?$/i.test(targetUrl) || targetUrl.startsWith('http://') || targetUrl.startsWith('https://');

      if (!isUrl) {
        // URLではない場合はDuckDuckGoで検索
        targetUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(targetUrl);
      } else if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        targetUrl = 'https://' + targetUrl;
      }

      const proxyUrl = '/api/proxy?url=' + encodeURIComponent(targetUrl);
      browserFrame.src = proxyUrl;
      urlInput.value = targetUrl;
    });

    // 初期起動時はDuckDuckGoを表示
    urlInput.value = 'https://duckduckgo.com/';
    browserFrame.src = '/api/proxy?url=' + encodeURIComponent('https://duckduckgo.com/');
  </script>
</body>
</html>
