<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eeeproxy</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      background: #1e293b;
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }
    .nav-btn {
      padding: 10px 14px;
      background: #334155;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-btn:hover {
      background: #475569;
    }
    #url-form {
      flex: 1;
      display: flex;
      gap: 8px;
    }
    #url-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    #url-input:focus {
      border-color: #3b82f6;
    }
    #go-btn {
      padding: 10px 20px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #go-btn:hover {
      background: #2563eb;
    }
    #tabs-container {
      background: #090d16;
      padding: 6px 16px 0 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid #1e293b;
    }
    .tab {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 6px 6px 0 0;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 150px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #94a3b8;
    }
    .tab.active {
      background: #0f172a;
      color: #fff;
      border-top: 2px solid #3b82f6;
    }
    .tab-close {
      font-weight: bold;
      border-radius: 50%;
      padding: 0 4px;
    }
    .tab-close:hover {
      background: rgba(255,255,255,0.2);
    }
    #new-tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      padding: 0 8px;
    }
    #new-tab-btn:hover {
      color: #fff;
    }
    #browser-container {
      flex: 1;
      position: relative;
      background: #fff;
    }
    .browser-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    .browser-view.active {
      display: block;
    }
  </style>
</head>
<body>
  <div id="tabs-container">
    <div id="tabs-list"></div>
    <button id="new-tab-btn" title="新しいタブ">+</button>
  </div>
  <div id="toolbar">
    <button class="nav-btn" id="back-btn" title="戻る">←</button>
    <button class="nav-btn" id="forward-btn" title="進む">→</button>
    <form id="url-form">
      <input type="text" id="url-input" placeholder="URLまたは検索キーワードを入力..." />
      <button type="submit" id="go-btn">アクセス / 検索</button>
    </form>
  </div>
  <div id="browser-container"></div>

  <script>
    let tabs = [];
    let activeTabId = null;
    let nextTabId = 1;

    const tabsList = document.getElementById('tabs-list');
    const browserContainer = document.getElementById('browser-container');
    const urlInput = document.getElementById('url-input');
    const urlForm = document.getElementById('url-form');
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const newTabBtn = document.getElementById('new-tab-btn');

    function createTab(initialUrl = 'https://duckduckgo.com/') {
      const id = nextTabId++;
      
      const iframe = document.createElement('iframe');
      iframe.className = 'browser-view';
      browserContainer.appendChild(iframe);

      const tab = {
        id,
        title: 'DuckDuckGo',
        url: initialUrl,
        iframe: iframe
      };

      tabs.push(tab);

      let targetUrl = initialUrl;
      const isUrl = /^(https?:\/\/)?[\w.-]+\.[a-z]{2,}([\/?#].*)?$/i.test(targetUrl) || targetUrl.startsWith('http://') || targetUrl.startsWith('https://');
      if (!isUrl) {
        targetUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(targetUrl);
      } else if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        targetUrl = 'https://' + targetUrl;
      }

      iframe.src = '/api/proxy?url=' + encodeURIComponent(targetUrl);
      
      switchTab(id);
      renderTabs();
    }

    function switchTab(id) {
      activeTabId = id;
      tabs.forEach(t => {
        if (t.id === id) {
          t.iframe.classList.add('active');
          urlInput.value = t.url;
        } else {
          t.iframe.classList.remove('active');
        }
      });
      renderTabs();
    }

    function closeTab(id, e) {
      e.stopPropagation();
      if (tabs.length === 1) {
        // 最後の1つの場合はDuckDuckGoに戻す
        tabs[0].url = 'https://duckduckgo.com/';
        tabs[0].iframe.src = '/api/proxy?url=' + encodeURIComponent('https://duckduckgo.com/');
        urlInput.value = 'https://duckduckgo.com/';
        renderTabs();
        return;
      }

      const index = tabs.findIndex(t => t.id === id);
      if (index !== -1) {
        tabs[index].iframe.remove();
        tabs.splice(index, 1);
        if (activeTabId === id) {
          switchTab(tabs[Math.max(0, index - 1)].id);
        } else {
          renderTabs();
        }
      }
    }

    function renderTabs() {
      tabsList.innerHTML = '';
      tabs.forEach(t => {
        const div = document.createElement('div');
        div.className = 'tab' + (t.id === activeTabId ? ' active' : '');
        div.innerHTML = `<span>${t.title || 'ページ'}</span><span class="tab-close">&times;</span>`;
        div.addEventListener('click', () => switchTab(t.id));
        div.querySelector('.tab-close').addEventListener('click', (e) => closeTab(t.id, e));
        tabsList.appendChild(div);
      });
    }

    urlForm.addEventListener('submit', (e) => {
      e.preventDefault();
      let inputVal = urlInput.value.trim();
      if (!inputVal) return;

      let targetUrl = inputVal;
      const isUrl = /^(https?:\/\/)?[\w.-]+\.[a-z]{2,}([\/?#].*)?$/i.test(targetUrl) || targetUrl.startsWith('http://') || targetUrl.startsWith('https://');

      if (!isUrl) {
        targetUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(targetUrl);
      } else if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        targetUrl = 'https://' + targetUrl;
      }

      const activeTab = tabs.find(t => t.id === activeTabId);
      if (activeTab) {
        activeTab.url = targetUrl;
        activeTab.title = targetUrl;
        activeTab.iframe.src = '/api/proxy?url=' + encodeURIComponent(targetUrl);
        renderTabs();
      }
    });

    backBtn.addEventListener('click', () => {
      const activeTab = tabs.find(t => t.id === activeTabId);
      if (activeTab) {
        try { activeTab.iframe.contentWindow.history.back(); } catch(e) {}
      }
    });

    forwardBtn.addEventListener('click', () => {
      const activeTab = tabs.find(t => t.id === activeTabId);
      if (activeTab) {
        try { activeTab.iframe.contentWindow.history.forward(); } catch(e) {}
      }
    });

    newTabBtn.addEventListener('click', () => {
      createTab('https://duckduckgo.com/');
    });

    // 起動時は新しいタブ（DuckDuckGo）を1つ開く
    createTab('https://duckduckgo.com/');
  </script>
</body>
</html>
